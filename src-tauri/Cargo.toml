[package]
name = "sidebyside"
version = "0.1.1"
description = "SideBySide by 92-bit: fast, lightweight side-by-side text comparison"
authors = ["92-bit"]
license = "GPL-3.0-only"
repository = "https://github.com/92-bit/SideBySide"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sidebyside_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
memchr = "2"
tauri-plugin-dialog = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
imara-diff = "0.2.0"
tauri-plugin-single-instance = "2"
ureq = "2"
minisign-verify = "0.3.0"
base64 = "0.23.1"
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
mslnk = "0.1.8"
winreg = "0.56.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
